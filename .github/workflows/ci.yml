name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: 20

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://xele:xele@localhost:5433/xele
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:cov

  e2e:
    name: End-to-end tests
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xele
          POSTGRES_PASSWORD: xele
          POSTGRES_DB: xele
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U xele -d xele"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://xele:xele@localhost:5433/xele
      REDIS_URL: redis://localhost:6379
      API_PORT: 3001
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply database migrations
        run: pnpm --filter @xel-e/api exec prisma migrate deploy

      - name: Run e2e tests
        run: pnpm e2e

  build:
    name: Build
    needs: quality
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://xele:xele@localhost:5433/xele
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
